name: CI CD Pipeline for Staging Environment

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with: 
          node-version: "20.x"
      - name: Install dependencies
        run: npm install
      - name: Run the server
        run: npm run start