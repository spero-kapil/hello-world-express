name: Deploy to Ubuntu

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu
    runs-on: [self-hosted, linux]

    defaults:
      run:
        shell: bash

    env:
      DEPLOY_DIR: /var/www/Projects/Learning/ci-cd-pipeline/hello-world-express

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment
        run: |
          node "$DEPLOY_DIR/server.js"
          echo "Deployment completed successfully."